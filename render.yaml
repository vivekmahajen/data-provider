# Render Blueprint — one-click deploy of the candidate registry with a managed
# Postgres database (so candidate signups persist across redeploys).
#
# Deploy: push this repo to GitHub → render.com → New → Blueprint → pick this
# repo. Render reads this file, creates the web service + a free Postgres DB,
# and wires DATABASE_URL automatically. After the first deploy, set a real
# ADMIN_API_KEY in the service's Environment tab.
services:
  - type: web
    name: candidate-registry
    runtime: node
    rootDir: app          # the app lives in the app/ subdirectory
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL          # Postgres → data persists (registry signups)
        fromDatabase:
          name: registry-db
          property: connectionString
      - key: ADMIN_API_KEY         # set a real secret value after first deploy
        sync: false
      # Optional integrations — add in the dashboard if/when you use them:
      # - key: STRIPE_SECRET_KEY
      #   sync: false
      # - key: STRIPE_WEBHOOK_SECRET
      #   sync: false

databases:
  - name: registry-db
    plan: free
